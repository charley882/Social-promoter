<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Social Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    header {
      text-align: center;
      padding: 35px 20px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
    }

    header p {
      color: #999;
      margin-top: 8px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 16px;
      border-radius: 12px;
      background: #222229;
      color: white;
      text-decoration: none;
    }

    .panel {
      background: #17171d;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .panel h2 {
      margin-top: 0;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      margin-bottom: 15px;
      border: none;
      border-radius: 12px;
      background: #262630;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #00a82d;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .info {
      color: #aaa;
      font-size: 14px;
      line-height: 1.5;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #202027;
      display: none;
    }
  </style>
</head>

<body>

  <header>
    <h1>🟢 Kik</h1>
    <p>Share your Kik username</p>
  </header>

  <div class="container">

    <a class="back" href="index.html">
      ← Back
    </a>

    <div class="panel">

      <h2>Add your Kik</h2>

      <p class="info">
        Enter the username you want people to see.
      </p>

      <input
        type="text"
        id="username"
        placeholder="Kik username"
        maxlength="30"
      >

      <textarea
        id="bio"
        placeholder="Short description (optional)"
        maxlength="150"
      ></textarea>

      <button onclick="previewProfile()">
        Preview Profile
      </button>

      <div id="result"></div>

    </div>

  </div>

  <script>
    function previewProfile() {

      const username = document.getElementById("username").value.trim();
      const bio = document.getElementById("bio").value.trim();
      const result = document.getElementById("result");

      if (username === "") {
        alert("Please enter a Kik username.");
        return;
      }

      result.style.display = "block";

      result.innerHTML =
        "<strong>🟢 Kik</strong><br><br>" +
        "<strong>Username:</strong> " +
        escapeHTML(username) +
        "<br><br>" +
        "<strong>About:</strong><br>" +
        (bio ? escapeHTML(bio) : "No description added.");
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>

</body>
</html>
