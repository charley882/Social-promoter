<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Social Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
    }

    header {
      text-align: center;
      padding: 45px 20px 25px;
    }

    header h1 {
      margin: 0;
      font-size: 42px;
    }

    header p {
      margin-top: 10px;
      color: #999;
      font-size: 16px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      display: block;
      padding: 25px 20px;
      margin-bottom: 18px;
      border-radius: 20px;
      text-decoration: none;
      color: white;
      text-align: left;
      box-shadow: 0 8px 25px rgba(0,0,0,0.35);
      transition: transform 0.15s;
    }

    .card:active {
      transform: scale(0.97);
    }

    .card-title {
      font-size: 25px;
      font-weight: bold;
    }

    .card-description {
      margin-top: 7px;
      font-size: 15px;
      opacity: 0.85;
    }

    .kik {
      background: #00a82d;
    }

    .snapchat {
      background: #f4e600;
      color: #111;
    }

    .instagram {
      background: #d62976;
    }

    .telegram {
      background: #229ed9;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Social Hub</h1>
    <p>Find people • Share your socials • Connect</p>
  </header>

  <div class="container">

    <a class="card kik" href="javascript:openSection('Kik')">
      <div class="card-title">🟢 Kik</div>
      <div class="card-description">
        Find and share Kik usernames.
      </div>
    </a>

    <a class="card snapchat" href="javascript:openSection('Snapchat')">
      <div class="card-title">👻 Snapchat</div>
      <div class="card-description">
        Find and share Snapchat usernames.
      </div>
    </a>

    <a class="card instagram" href="javascript:openSection('Instagram')">
      <div class="card-title">📸 Instagram</div>
      <div class="card-description">
        Find and share Instagram usernames.
      </div>
    </a>

    <a class="card telegram" href="javascript:openSection('Telegram')">
      <div class="card-title">✈️ Telegram</div>
      <div class="card-description">
        Find and share Telegram usernames.
      </div>
    </a>

  </div>

  <footer>
    Social Hub
  </footer>

  <script>
    function openSection(platform) {
      alert(platform + " section coming next!");
    }
  </script>

</body>
</html>
